<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticker Sheets — Design Your Own | Morphii</title>
<meta name="description" content="Pick stickers, set the white holder, and arrange them on an A4 sheet automatically.">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stickers.css?v=9">
</head>
<body>

<header class="st-header">
  <div class="st-logo">morphii<span class="dot">.</span> <small>Sticker Sheets</small></div>
  <a class="st-link" href="create.html">← Button pins</a>
</header>

<main class="st-layout">
  <!-- PANEL 1: LIBRARY -->
  <section class="st-card" id="libCard">
    <div class="st-lib-head">
      <h2>Sticker library</h2>
      <span class="st-tip">Tap to add · tap again for more</span>
      <label class="st-text-btn" for="uploadInput">＋ Upload</label>
      <input type="file" id="uploadInput" accept="image/png,image/webp,image/jpeg" style="display:none">
      <button class="st-text-btn" id="libToggle" aria-expanded="false">All groups ▾</button>
    </div>
    <div class="st-groups" id="libCats"></div>
    <div class="st-lib-grid" id="libGrid"></div>
  </section>

  <!-- PANEL 2: PREVIEW (summary, sheet, white holder) -->
  <section class="st-card st-preview-col" id="previewCard">
    <h2>Your A4 sheet</h2>
    <div class="st-summary" id="summary"></div>
    <div class="st-sheet-tabs" id="sheetTabs"></div>

    <div class="st-selbar" id="selBar" style="display:none;">
      <div class="st-sel-thumb"><img id="selImg" alt=""></div>
      <div class="st-sel-grp"><span class="st-mini">Copies</span>
        <span class="st-step"><button data-sel="qty-" id="selQtyMinus" aria-label="Fewer copies">−</button><b id="selQty"></b><button data-sel="qty+" aria-label="Add a copy">+</button></span></div>
      <div class="st-sel-grp"><span class="st-mini">Size</span>
        <span class="st-step"><button data-sel="size-" aria-label="Smaller">−</button><b id="selSize"></b><button data-sel="size+" aria-label="Bigger">+</button></span></div>
    </div>
    <div class="st-hint" id="selHint" style="display:none;">Tap a sticker on the sheet to add copies or change its size.</div>

    <div class="st-empty" id="sheetEmpty">Your stickers will be arranged here automatically.</div>
    <div class="st-sheet-wrap" id="sheetWrap" style="display:none;"><canvas id="sheetCanvas" width="1050" height="1485"></canvas></div>
    <div class="st-empty" id="sheetBusy" style="display:none;padding:8px;">Arranging…</div>
    <div id="sheetWarn"></div>

    <div class="st-holder">
      <div class="st-h-row">
        <span class="st-h-label">White holder</span>
        <div class="st-seg" id="styleChips">
          <button class="active" data-style="contour">Follow shape</button>
          <button data-style="circle">Circle</button>
          <button data-style="rounded">Rounded</button>
          <button data-style="none">None</button>
        </div>
      </div>
      <div class="st-h-row" id="borderRow">
        <span class="st-h-label">Width</span>
        <input class="st-range" id="setBorder" type="range" min="0" max="8" step="0.5" value="3" aria-label="Holder width">
        <span class="st-range-val" id="setBorderVal"></span>
      </div>
      <div class="st-h-row st-h-checks">
        <label class="st-check"><input type="checkbox" id="setRotate" checked> Turn stickers 90° to fit more</label>
        <label class="st-check"><input type="checkbox" id="setShowCut" checked> Show cut line <i class="st-dot"></i></label>
      </div>
    </div>

    <!-- Admin tools are built here by stickers.js only after Firebase confirms an admin sign-in. -->
    <div id="adminMount"></div>
  </section>
</main>

<div class="st-mobbar" id="mobBar"><span id="mobCount"></span><button class="st-btn" id="mobGo">View my sheet ↓</button></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=10"></script>
<script src="stickers.js?v=6"></script>
</body>
</html>
